server:
  port: 7071

spring:
  cloud:
    gateway:
      routes:
        # 资源服务：上传走 UserAuth 鉴权（媒体路由必须在 /web/** 之前）
        - id: resource-route
          uri: http://127.0.0.1:7074
          predicates:
            - Path=/resource/**
          filters:
            - UserAuth
        - id: web-hls-route
          uri: http://127.0.0.1:7074
          predicates:
            - Path=/web/hls/**
          filters:
            - StripPrefix=1
        - id: web-images-route
          uri: http://127.0.0.1:7074
          predicates:
            - Path=/web/images/**
          filters:
            - StripPrefix=1
        - id: web-video-resource-route
          uri: http://127.0.0.1:7074
          predicates:
            - Path=/web/video/resource/**
          filters:
            - StripPrefix=1
        - id: web-route
          uri: http://127.0.0.1:7070
          predicates:
            - Path=/web/**
          filters:
            - StripPrefix=1
        - id: admin-route
          uri: http://127.0.0.1:7075
          predicates:
            - Path=/admin/**
          filters:
            - AdminAuth
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
  redis:
    host: 127.0.0.1
    port: 6379

logging:
  level:
    com.videoshare.gateway: debug
